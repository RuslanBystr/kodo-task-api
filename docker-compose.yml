

services:
  postgres:
    image: postgres:16
    container_name: kodotask-pg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - ${POSTGRES_PORT}:5432

    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata


volumes:
  pgdata:
    driver: local


services:
  postgres:
    image: postgres:16
    container_name: kodotask-pg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - ${POSTGRES_PORT}:5432

    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata

  redis:
    image: redis:7
    container_name: kodotask-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
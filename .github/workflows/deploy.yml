name: Deploy to Hetzner

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for completeness; not used on server build)
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          set -x
          
          : "${HETZNER_HOST:?Missing HETZNER_HOST secret}"
          : "${HETZNER_USER:?Missing HETZNER_USER secret}"
          : "${HETZNER_SSH_KEY:?Missing HETZNER_SSH_KEY secret}"
          
          echo "HOME is: $HOME"
          whoami
          ls -la "$HOME"
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "$HETZNER_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          ssh-keyscan -T 15 -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on Hetzner
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}

          NODE_VERSION: "20"
          APP_DIR: "KodoTaskAPI"
          BRANCH: "develop"
          PM2_APP_NAME: "kodotask"
        run: |
          ssh -t "${HETZNER_USER}@${HETZNER_HOST}" << EOF
            set -e

            cd "$HOME/${APP_DIR}"

            git fetch origin
            git checkout "${BRANCH}"
            git pull origin "${BRANCH}"
          
            npm ci

            npm run build
            
            npm run typeorm:run-migrations

            pm2 restart kodotask
          
          EOF

name: Deploy to Hetzner

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Hetzner
      url: https://api.api-kodotask.org/api

    steps:
      - name: Checkout (for completeness; not used on server build)
        uses: actions/checkout@v4

      - name: Connectivity check to SSH
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          set -euo pipefail
          echo "HETZNER_HOST='$HETZNER_HOST'"
          echo "A records (IPv4):"; getent ahostsv4 "$HETZNER_HOST" || true
          echo "Probing TCP 22...."
          timeout 5 bash -lc "cat < /dev/null > /dev/tcp/$HETZNER_HOST/22" \
            && echo "✅ TCP 22 reachable" || (echo "❌ Cannot reach $HETZNER_HOST:22"; exit 1)

      - name: Setup SSH
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          set -x
          
          : "${HETZNER_HOST:?Missing HETZNER_HOST secret}"
          : "${HETZNER_USER:?Missing HETZNER_USER secret}"
          : "${HETZNER_SSH_KEY:?Missing HETZNER_SSH_KEY secret}"
          
          echo "HOME is: $HOME"
          whoami
          ls -la "$HOME"
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "$HETZNER_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          ssh-keyscan -T 15 -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on Hetzner
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          APP_DIR: "KodoTaskAPI"
          BRANCH: "develop"
          PM2_APP_NAME: "kodotask"
        run: |
          set -euo pipefail
          ssh -4 -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -t "${HETZNER_USER}@${HETZNER_HOST}" << EOF
            set -e

            cd "\$HOME/${APP_DIR}"

            git fetch origin
            git checkout "${BRANCH}"
            git pull origin "${BRANCH}"

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            npm run build
            npm run typeorm:run-migrations || true

            pm2 restart "${PM2_APP_NAME}" || pm2 start dist/main.js --name "${PM2_APP_NAME}"
            pm2 save
          EOF
